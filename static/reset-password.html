cat > static/reset-password.html << 'EOF'
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | GrievAI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background:linear-gradient(135deg,#0B1E33,#1A3A5C);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:system-ui,sans-serif;
    padding:20px;
}
.card{
    background:white;
    border-radius:28px;
    padding:40px;
    max-width:400px;
    width:100%;
    box-shadow:0 25px 50px rgba(0,0,0,0.3);
}
h2{text-align:center;color:#0B1E33;margin-bottom:20px;}
input{
    width:100%;
    padding:14px;
    border:2px solid #ddd;
    border-radius:16px;
    margin-bottom:15px;
    font-size:16px;
}
input:focus{outline:none;border-color:#FF6200;}
button{
    width:100%;
    padding:14px;
    background:#FF6200;
    color:white;
    border:none;
    border-radius:40px;
    font-weight:bold;
    cursor:pointer;
    font-size:16px;
}
button:hover{background:#FF8534;}
.alert{padding:12px;border-radius:14px;margin-bottom:15px;display:none;font-size:14px;}
.alert-error{background:#FFEBEE;color:#C62828;}
.alert-success{background:#E8F5E9;color:#0A7C3E;}
.back-link{text-align:center;margin-top:15px;}
.back-link a{color:#FF6200;text-decoration:none;}
</style>
</head>
<body>
<div class="card">
    <h2>नया पासवर्ड सेट करें</h2>
    <div id="alert" class="alert"></div>
    <input type="password" id="newPassword" placeholder="नया पासवर्ड (6+ अक्षर)">
    <input type="password" id="confirmPassword" placeholder="पासवर्ड दोबारा डालें">
    <button onclick="resetPassword()">पासवर्ड रीसेट करें</button>
    <div class="back-link"><a href="/login.html">← Login पर वापस जाएं</a></div>
</div>
<script>
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');
const email = urlParams.get('email');

function showAlert(msg, isError){
    const el = document.getElementById('alert');
    el.innerHTML = (isError ? '❌ ' : '✅ ') + msg;
    el.className = 'alert ' + (isError ? 'alert-error' : 'alert-success');
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 5000);
}

async function resetPassword(){
    const newPw = document.getElementById('newPassword').value;
    const confirmPw = document.getElementById('confirmPassword').value;
    
    if(!newPw || newPw.length<6){
        showAlert('पासवर्ड कम से कम 6 अक्षर', true);
        return;
    }
    if(newPw !== confirmPw){
        showAlert('पासवर्ड मैच नहीं', true);
        return;
    }
    if(!token || !email){
        showAlert('Invalid reset link', true);
        return;
    }
    
    try{
        const res = await fetch('/api/auth/reset-password', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({email:email, token:token, new_password:newPw})
        });
        const data = await res.json();
        if(data.success){
            showAlert('✅ पासवर्ड बदल गया! अब लॉगिन करें', false);
            setTimeout(() => { window.location.href = '/login.html'; }, 2000);
        } else {
            showAlert(data.error || 'रीसेट फेल', true);
        }
    } catch(e){
        showAlert('सर्वर एरर', true);
    }
}
</script>
</body>
</html>
EOF
