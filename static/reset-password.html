<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrievAI — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Raleway', sans-serif;
    background: linear-gradient(135deg, #020d1a, #041525, #020d1a);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .water-bg {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 30% 40%, #0a2a4a 0%, transparent 60%);
    animation: pulse 8s ease-in-out infinite alternate;
  }
  @keyframes pulse {
    0% { filter: brightness(1); }
    100% { filter: brightness(1.15); }
  }
  .card {
    position: relative;
    z-index: 10;
    width: 400px;
    max-width: 90vw;
    background: rgba(5, 11, 17, 0.55);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(79, 195, 247, 0.25);
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    animation: slideUp 0.6s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .title {
    font-family: 'Cinzel', serif;
    font-size: 24px;
    text-align: center;
    color: #4fc3f7;
    margin-bottom: 30px;
    text-shadow: 0 0 20px rgba(79,195,247,0.4);
  }
  .field { margin-bottom: 20px; }
  .field label {
    display: block;
    font-size: 11px;
    color: rgba(150,200,230,0.6);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .field input {
    width: 100%;
    background: rgba(79,195,247,0.05);
    border: 1px solid rgba(79,195,247,0.2);
    border-radius: 8px;
    padding: 12px 16px;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  .field input:focus {
    border-color: rgba(79,195,247,0.6);
    box-shadow: 0 0 0 3px rgba(79,195,247,0.1);
  }
  .btn {
    width: 100%;
    background: transparent;
    border: 1px solid rgba(79,195,247,0.4);
    border-radius: 8px;
    padding: 12px;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: #4fc3f7;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 10px;
  }
  .btn:hover {
    border-color: rgba(79,195,247,0.8);
    box-shadow: 0 0 15px rgba(79,195,247,0.2);
  }
  .alert {
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 12px;
    display: none;
  }
  .alert-error { background: rgba(198,40,40,0.2); color: #ff8a8a; border-left: 3px solid #ff5c5c; }
  .alert-success { background: rgba(10,124,62,0.2); color: #8bcb9a; border-left: 3px solid #4caf50; }
  .back-link {
    text-align: center;
    margin-top: 20px;
  }
  .back-link a {
    color: rgba(150,200,230,0.6);
    font-size: 12px;
    text-decoration: none;
    cursor: pointer;
  }
  .back-link a:hover { color: #4fc3f7; }
</style>
</head>
<body>
<div class="water-bg"></div>
<div class="card">
  <h1 class="title">Reset Password</h1>
  <div id="alert" class="alert"></div>
  <div class="field">
    <label>🔑 NEW PASSWORD</label>
    <input type="password" id="newPassword" placeholder="Enter new password (min 6 chars)">
  </div>
  <div class="field">
    <label>🔒 CONFIRM PASSWORD</label>
    <input type="password" id="confirmPassword" placeholder="Confirm new password">
  </div>
  <button class="btn" onclick="resetPassword()">RESET PASSWORD</button>
  <div class="back-link"><a href="/login.html">← Back to Login</a></div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  const email = urlParams.get('email');

  function showAlert(msg, isError) {
    const el = document.getElementById('alert');
    el.innerHTML = (isError ? '❌ ' : '✅ ') + msg;
    el.className = 'alert ' + (isError ? 'alert-error' : 'alert-success');
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 5000);
  }

  async function resetPassword() {
    const newPw = document.getElementById('newPassword').value;
    const confirmPw = document.getElementById('confirmPassword').value;

    if(!newPw || newPw.length < 6) {
      showAlert('Password must be at least 6 characters', true);
      return;
    }
    if(newPw !== confirmPw) {
      showAlert('Passwords do not match', true);
      return;
    }
    if(!token || !email) {
      showAlert('Invalid or expired reset link. Please request a new one.', true);
      return;
    }

    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, token: token, new_password: newPw })
      });
      const data = await res.json();
      if(data.success) {
        showAlert('✅ Password reset successful! Redirecting to login...', false);
        setTimeout(() => { window.location.href = '/login.html'; }, 2000);
      } else {
        showAlert(data.error || 'Reset failed', true);
      }
    } catch(e) {
      showAlert('Server error. Please try again.', true);
    }
  }
</script>
</body>
</html>
