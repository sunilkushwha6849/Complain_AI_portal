<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | GrievAI Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'Noto Sans Devanagari',sans-serif;
    background:linear-gradient(135deg,#0B1E33,#1A3A5C);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.card{
    background:white;
    border-radius:28px;
    padding:40px;
    max-width:450px;
    width:100%;
    box-shadow:0 25px 50px rgba(0,0,0,0.3);
    animation:slideUp 0.5s ease;
}
@keyframes slideUp{
    from{opacity:0;transform:translateY(30px);}
    to{opacity:1;transform:translateY(0);}
}
.logo{
    text-align:center;
    margin-bottom:25px;
}
.logo-icon{
    width:60px;
    height:60px;
    background:linear-gradient(135deg,#F5C518,#E8B800);
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    margin:0 auto 12px;
}
h2{
    text-align:center;
    color:#0B1E33;
    margin-bottom:8px;
}
.sub{
    text-align:center;
    color:#7A8FA0;
    font-size:0.85rem;
    margin-bottom:25px;
}
input{
    width:100%;
    padding:14px 16px;
    border:2px solid #E0DDD6;
    border-radius:16px;
    font-size:1rem;
    font-family:inherit;
    margin-bottom:18px;
    transition:all 0.3s;
}
input:focus{
    outline:none;
    border-color:#FF6200;
    box-shadow:0 0 0 3px rgba(255,98,0,0.1);
}
.btn{
    width:100%;
    padding:14px;
    background:linear-gradient(135deg,#FF6200,#FF8534);
    color:white;
    border:none;
    border-radius:40px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    transition:transform 0.2s;
}
.btn:hover{transform:translateY(-2px);}
.alert{
    padding:12px;
    border-radius:14px;
    margin-bottom:18px;
    display:none;
    font-size:0.85rem;
}
.alert-error{background:#FFEBEE;color:#C62828;border-left:4px solid #C62828;}
.alert-success{background:#E8F5E9;color:#0A7C3E;border-left:4px solid #0A7C3E;}
.back-link{
    text-align:center;
    margin-top:20px;
}
.back-link a{
    color:#FF6200;
    text-decoration:none;
    font-weight:600;
}
</style>
</head>
<body>
<div class="card">
    <div class="logo">
        <div class="logo-icon">⚖️</div>
        <h2>नया पासवर्ड सेट करें</h2>
        <div class="sub">अपना नया पासवर्ड डालें</div>
    </div>
    <div id="alert" class="alert"></div>
    <input type="password" id="newPassword" placeholder="नया पासवर्ड (6+ अक्षर)">
    <input type="password" id="confirmPassword" placeholder="पासवर्ड दोबारा डालें">
    <button class="btn" onclick="resetPassword()">पासवर्ड रीसेट करें</button>
    <div class="back-link"><a href="/login.html">← Login पर वापस जाएं</a></div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');
const email = urlParams.get('email');

function showAlert(msg, isError){
    const el = document.getElementById('alert');
    el.innerHTML = (isError ? '❌ ' : '✅ ') + msg;
    el.className = 'alert ' + (isError ? 'alert-error' : 'alert-success');
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 5000);
}

async function resetPassword(){
    const newPw = document.getElementById('newPassword').value;
    const confirmPw = document.getElementById('confirmPassword').value;
    
    if(!newPw || newPw.length < 6){
        showAlert('पासवर्ड कम से कम 6 अक्षर का होना चाहिए', true);
        return;
    }
    if(newPw !== confirmPw){
        showAlert('पासवर्ड मैच नहीं हो रहा', true);
        return;
    }
    if(!token || !email){
        showAlert('Invalid reset link. Please request new reset link.', true);
        return;
    }
    
    try{
        const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ email: email, token: token, new_password: newPw })
        });
        const data = await res.json();
        if(data.success){
            showAlert('✅ पासवर्ड सफलतापूर्वक बदल गया! अब लॉगिन करें', false);
            setTimeout(() => { window.location.href = '/login.html'; }, 2000);
        } else {
            showAlert(data.error || 'रीसेट फेल हुआ', true);
        }
    } catch(e){
        showAlert('सर्वर से कनेक्ट नहीं हो पाया', true);
    }
}
</script>
</body>
</html>
